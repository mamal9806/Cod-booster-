name: Hybrid Chatbot Python Tests

on:
  push:
    branches: [main]
    paths:
      - 'ai_chatbot/**'
      - '.github/workflows/chatbot-tests.yml'
  pull_request:
    paths:
      - 'ai_chatbot/**'
      - '.github/workflows/chatbot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run chatbot tests
        env:
          PYTHONPATH: ai_chatbot
        run: python -m unittest discover -s ai_chatbot/tests -v
